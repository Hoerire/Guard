plugins { id 'com.android.application' }

android { namespace 'com.example.guard'; compileSdk 35
    defaultConfig {
        applicationId 'com.example.guard'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0'
        // 仅构建 arm64-v8a 原生架构
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    sourceSets { main { assets.srcDirs += file("src/main/assets") } }
}